<section class="form-card">

    <h2>Weekly Workplace Readiness Check-In</h2>

    <p class="section-description">
        Evaluate the resident’s current workplace readiness and weekly progress trends.
    </p>

    <!-- ================= SCALE GUIDE ================= -->
    <div class="rating-scale">

        <div class="scale-item">
            <span>1 = Needs Significant Support</span>
            <span>3 = Developing</span>
            <span>5 = Consistently Demonstrates</span>
        </div>

    </div>

    <!-- ================= READINESS METRICS ================= -->
    <div class="readiness-grid">

        <div class="readiness-item">
            <label>Attendance & Punctuality</label>
            <input type="range" min="1" max="5" value="3" class="readiness-slider">
            <div class="slider-labels"><span>Low</span><span>High</span></div>
        </div>

        <div class="readiness-item">
            <label>Follows Instructions</label>
            <input type="range" min="1" max="5" value="3" class="readiness-slider">
            <div class="slider-labels"><span>Low</span><span>High</span></div>
        </div>

        <div class="readiness-item">
            <label>Communication Skills</label>
            <input type="range" min="1" max="5" value="3" class="readiness-slider">
            <div class="slider-labels"><span>Low</span><span>High</span></div>
        </div>

        <div class="readiness-item">
            <label>Task Completion Consistency</label>
            <input type="range" min="1" max="5" value="3" class="readiness-slider">
            <div class="slider-labels"><span>Low</span><span>High</span></div>
        </div>

        <div class="readiness-item">
            <label>Receives Feedback</label>
            <input type="range" min="1" max="5" value="3" class="readiness-slider">
            <div class="slider-labels"><span>Low</span><span>High</span></div>
        </div>

        <div class="readiness-item">
            <label>Independent Work Ability</label>
            <input type="range" min="1" max="5" value="3" class="readiness-slider">
            <div class="slider-labels"><span>Low</span><span>High</span></div>
        </div>

        <div class="readiness-item">
            <label>Asks for Help Appropriately</label>
            <input type="range" min="1" max="5" value="3" class="readiness-slider">
            <div class="slider-labels"><span>Low</span><span>High</span></div>
        </div>

        <div class="readiness-item">
            <label>Engagement & Participation</label>
            <input type="range" min="1" max="5" value="3" class="readiness-slider">
            <div class="slider-labels"><span>Low</span><span>High</span></div>
        </div>

    </div>

    <!-- ================= WEEKLY NOTES ================= -->
    <div class="form-card" style="margin-top:20px;">

        <h3>Weekly Notes</h3>

        <div class="form-grid">

            <div class="field full-width">
                <label>Key Progress This Week</label>
                <textarea rows="3" placeholder="What improved this week?"></textarea>
            </div>

            <div class="field full-width">
                <label>Challenges Observed</label>
                <textarea rows="3" placeholder="What barriers or issues came up?"></textarea>
            </div>

            <div class="field full-width">
                <label>Support Needed Next Week</label>
                <textarea rows="3" placeholder="What support is recommended?"></textarea>
            </div>

        </div>
    </div>

    <!-- ================= SUBMIT ================= -->
    <div class="form-actions">

        <button type="submit" class="submit-btn">
            Submit Weekly Check-In
        </button>

    </div>

</section>
