<section class="form-card">

    <h2>Section B — Initial Workplace Readiness</h2>

    <p class="section-description">
        Rate the resident's current workplace readiness.
    </p>

    <div class="rating-scale">

        <div class="scale-item">
            <span class="scale-low">1 = Needs Significant Support</span>
            <span class="scale-mid">3 = Developing</span>
            <span class="scale-high">5 = Consistently Demonstrates</span>
        </div>

    </div>

    <div class="readiness-grid">

        <!-- Attendance -->

        <div class="readiness-item">

            <label>
                How consistently does the resident arrive on time?
            </label>

            <input
                type="range"
                min="1"
                max="5"
                value="3"
                class="readiness-slider">

            <div class="slider-labels">
                <span>1</span>
                <span>2</span>
                <span>3</span>
                <span>4</span>
                <span>5</span>
            </div>

        </div>

        <!-- Instructions -->

        <div class="readiness-item">

            <label>
                How well does the resident follow instructions?
            </label>

            <input
                type="range"
                min="1"
                max="5"
                value="3"
                class="readiness-slider">

            <div class="slider-labels">
                <span>1</span>
                <span>2</span>
                <span>3</span>
                <span>4</span>
                <span>5</span>
            </div>

        </div>

        <!-- Communication -->

                How professionally does the resident communicate?

        <!-- Feedback -->
