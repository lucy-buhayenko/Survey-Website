<section class="form-card">

    <h2>Section D — Work Interests & Preferences</h2>

    <p class="section-description">
        Explore career interests, work preferences, and engagement levels.
    </p>

    <!-- ================= FAVORITE ACTIVITIES ================= -->
    <div class="field full-width">

        <label>What types of activities does the resident enjoy most?</label>

        <div class="interest-chips">

            <label class="chip">
                <input type="checkbox" name="activities" value="Technology">
                Technology
            </label>

            <label class="chip">
                <input type="checkbox" name="activities" value="Creative Arts">
                Creative Arts
            </label>

            <label class="chip">
                <input type="checkbox" name="activities" value="Sports">
                Sports
            </label>

            <label class="chip">
                <input type="checkbox" name="activities" value="Leadership">
                Leadership
            </label>

            <label class="chip">
                <input type="checkbox" name="activities" value="Customer Service">
                Customer Service
            </label>

            <label class="chip">
                <input type="checkbox" name="activities" value="Hands-On Projects">
                Hands-On Work
            </label>

            <label class="chip">
                <input type="checkbox" name="activities" value="Problem Solving">
                Problem Solving
            </label>

        </div>
    </div>

    <!-- ================= AVOIDED ACTIVITIES ================= -->
    <div class="field full-width">

        <label>What activities does the resident tend to avoid?</label>

        <textarea rows="3" placeholder="Describe activities the resident avoids..."></textarea>

    </div>

    <!-- ================= WORK STYLE ================= -->
    <div class="preference-card">

        <h3>Work Style Preference</h3>

        <div class="option-grid">

            <label class="choice-card">
                <input type="radio" name="workStyle" value="Team">
                Team Work
            </label>

            <label class="choice-card">
                <input type="radio" name="workStyle" value="Independent">
                Independent Work
            </label>

        </div>
    </div>

    <!-- ================= ENVIRONMENT ================= -->
    <div class="preference-card">

        <h3>Preferred Environment</h3>

        <div class="option-grid">

            <label class="choice-card">
                <input type="radio" name="environment" value="Structured">
                Structured
            </label>

            <label class="choice-card">
                <input type="radio" name="environment" value="Flexible">
                Flexible
            </label>

        </div>
    </div>

    <!-- ================= WORK FOCUS ================= -->
    <div class="preference-card">

        <h3>Work Focus Preference</h3>

        <div class="option-grid">

            <label class="choice-card">
                <input type="radio" name="focus" value="People">
                People-Focused
            </label>

            <label class="choice-card">
                <input type="radio" name="focus" value="Task">
                Task-Focused
            </label>

        </div>
    </div>

    <!-- ================= CAREER INTERESTS ================= -->
    <div class="field full-width">

        <label>What careers or industries interest the resident?</label>

        <select multiple class="career-select">
            <option>Healthcare</option>
            <option>Technology</option>
            <option>Construction</option>
            <option>Skilled Trades</option>
            <option>Business</option>
            <option>Education</option>
            <option>Hospitality</option>
            <option>Retail</option>
            <option>Public Service</option>
            <option>Transportation</option>
        </select>

    </div>

    <!-- ================= CAREER AWARENESS ================= -->
    <div class="field full-width">

        <label>Career pathway understanding</label>

        <div class="slider-container">

            <span>Needs Exploration</span>

            <input type="range" min="1" max="5" value="3" class="career-slider">

            <span>Highly Aware</span>

        </div>

    </div>

    <!-- ================= ENGAGEMENT ================= -->
    <div class="field full-width">

        <label>Engagement level during discussions</label>

        <div class="emoji-rating">

            <label>
                <input type="radio" name="engagement" value="1">
                1
            </label>

            <label>
                <input type="radio" name="engagement" value="2">
                2
            </label>

            <label>
                <input type="radio" name="engagement" value="3">
                3
            </label>

            <label>
                <input type="radio" name="engagement" value="4">
                4
            </label>

            <label>
                <input type="radio" name="engagement" value="5">
                5
            </label>

        </div>
    </div>

    <!-- ================= SUBMIT ================= -->
    <div class="form-actions">
        <button type="submit" class="submit-btn">
            Submit Form
        </button>
    </div>

</section>
