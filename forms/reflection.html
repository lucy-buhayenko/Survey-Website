<section class="form-card">

    <h2>Resident Reflection & Future Goals</h2>

    <p class="section-description">
        Capture resident reflections on progress, learning, challenges, and future employment goals.
    </p>

    <!-- ================= EXPERIENCE REFLECTION ================= -->
    <div class="form-card" style="margin-top:20px;">

        <h3>Program Experience</h3>

        <div class="form-grid">

            <div class="field full-width">
                <label>What accomplishment are you most proud of during the program?</label>
                <textarea rows="4" placeholder="Describe your biggest achievement..."></textarea>
            </div>

            <div class="field full-width">
                <label>What was the most valuable thing you learned?</label>
                <textarea rows="4" placeholder="Key skills or lessons learned..."></textarea>
            </div>

            <div class="field full-width">
                <label>What challenges did you overcome?</label>
                <textarea rows="4" placeholder="Difficulties you worked through..."></textarea>
            </div>

        </div>
    </div>

    <!-- ================= FUTURE GOALS ================= -->
    <div class="form-card" style="margin-top:20px;">

        <h3>Future Goals</h3>

        <div class="form-grid">

            <div class="field full-width">
                <label>What are your employment goals for the next 6 months?</label>
                <textarea rows="4" placeholder="Your short-term career goals..."></textarea>
            </div>

            <div class="field full-width">
                <label>What additional support would help you succeed?</label>
                <textarea rows="4" placeholder="Training, mentoring, resources..."></textarea>
            </div>

        </div>
    </div>

    <!-- ================= CONFIDENCE & FEEDBACK ================= -->
    <div class="form-card" style="margin-top:20px;">

        <h3>Confidence & Program Feedback</h3>

        <div class="form-grid">

            <div class="field">
                <label>How confident do you feel about finding employment?</label>
                <select>
                    <option>Very Confident</option>
                    <option>Confident</option>
                    <option>Somewhat Confident</option>
                    <option>Not Confident</option>
                </select>
            </div>

            <div class="field">
                <label>Would you recommend this program to others?</label>
                <select>
                    <option>Definitely</option>
                    <option>Probably</option>
                    <option>Not Sure</option>
                    <option>No</option>
                </select>
            </div>

        </div>
    </div>

    <!-- ================= FINAL THOUGHTS ================= -->
    <div class="field full-width" style="margin-top:20px;">

        <label>Final Comments</label>
        <textarea rows="5" placeholder="Any final thoughts, feedback, or suggestions..."></textarea>

    </div>

    <!-- ================= SUBMIT ================= -->
    <div class="form-actions">

        <button type="submit" class="submit-btn">
            Submit Reflection
        </button>

    </div>

</section>
