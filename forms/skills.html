<section class="form-card">

    <h2>Workforce Skills Assessment</h2>

    <p class="section-description">
        Evaluate the resident’s current level across key workforce competencies.
    </p>

    <!-- ================= LEVEL LEGEND ================= -->
    <div class="skill-level-guide">

        <span class="skill-level level-1">Not Yet Observed</span>
        <span class="skill-level level-2">Introduced</span>
        <span class="skill-level level-3">Practiced</span>
        <span class="skill-level level-4">Demonstrated</span>
        <span class="skill-level level-5">Independent</span>

    </div>

    <!-- ================= CORE SKILLS ================= -->
    <div class="form-card" style="margin-top:20px;">

        <h3>Core Workplace Skills</h3>

        <div class="skills-grid">

            <div class="skill-row">
                <label>Teamwork</label>
                <select name="teamwork">
                    <option value="">Select Level</option>
                    <option>Not Yet Observed</option>
                    <option>Introduced</option>
                    <option>Practiced</option>
                    <option>Demonstrated</option>
                    <option>Independent</option>
                </select>
            </div>

            <div class="skill-row">
                <label>Communication</label>
                <select name="communication">
                    <option value="">Select Level</option>
                    <option>Not Yet Observed</option>
                    <option>Introduced</option>
                    <option>Practiced</option>
                    <option>Demonstrated</option>
                    <option>Independent</option>
                </select>
            </div>

            <div class="skill-row">
                <label>Professionalism</label>
                <select name="professionalism">
                    <option value="">Select Level</option>
                    <option>Not Yet Observed</option>
                    <option>Introduced</option>
                    <option>Practiced</option>
                    <option>Demonstrated</option>
                    <option>Independent</option>
                </select>
            </div>

            <div class="skill-row">
                <label>Problem Solving</label>
                <select name="problemSolving">
                    <option value="">Select Level</option>
                    <option>Not Yet Observed</option>
                    <option>Introduced</option>
                    <option>Practiced</option>
                    <option>Demonstrated</option>
                    <option>Independent</option>
                </select>
            </div>

        </div>
    </div>

    <!-- ================= ORGANIZATION & EXECUTION ================= -->
    <div class="form-card" style="margin-top:20px;">

        <h3>Organization & Execution</h3>

        <div class="skills-grid">

            <div class="skill-row">
                <label>Organization</label>
                <select name="organization"></select>
            </div>

            <div class="skill-row">
                <label>Time Management</label>
                <select name="timeManagement"></select>
            </div>

            <div class="skill-row">
                <label>Attention to Detail</label>
                <select name="attentionToDetail"></select>
            </div>

            <div class="skill-row">
                <label>Adaptability</label>
                <select name="adaptability"></select>
            </div>

        </div>
    </div>

    <!-- ================= DIGITAL & TECH ================= -->
    <div class="form-card" style="margin-top:20px;">

        <h3>Digital & Workplace Tools</h3>

        <div class="skills-grid">

            <div class="skill-row">
                <label>Computer / Spreadsheet Skills</label>
                <select name="computerSkills"></select>
            </div>

            <div class="skill-row">
                <label>Phone / Customer Etiquette</label>
                <select name="phoneEtiquette"></select>
            </div>

        </div>
    </div>

    <!-- ================= LEADERSHIP ================= -->
    <div class="form-card" style="margin-top:20px;">

        <h3>Leadership Potential</h3>

        <div class="skills-grid">

            <div class="skill-row">
                <label>Leadership</label>
                <select name="leadership"></select>
            </div>

        </div>
    </div>

    <!-- ================= SUBMIT ================= -->
    <div class="form-actions">

        <button type="submit" class="submit-btn">
            Save Skill Assessment
        </button>

    </div>

</section>
