<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Activities Form</title>

    
    <link rel="stylesheet" href="../forms/forms.css">
</head>

<body>
<section class="form-card">

    <h2>Initial Barriers Assessment</h2>

    <p class="section-description">
        Identify barriers that may impact workforce readiness, participation, and placement success.
    </p>

    <!-- ================= BARRIER GRID ================= -->
    <div class="barrier-grid">

        <!-- ================= TRANSPORTATION ================= -->
        <div class="barrier-card">

            <div class="barrier-header">
                <label class="barrier-toggle">
                    <input type="checkbox" name="barriers" value="transportation">
                    <span>Transportation</span>
                </label>
            </div>

            <div class="barrier-details">

                <div class="field">
                    <label>Status</label>
                    <select name="transportation_status">
                        <option>Emerging</option>
                        <option>Ongoing</option>
                        <option>Improving</option>
                        <option>Resolved</option>
                        <option>Needs Follow-Up</option>
                    </select>
                </div>

                <div class="field">
                    <label>Severity Level</label>
                    <input type="range" min="1" max="5" value="3" class="severity-slider">
                    <div class="severity-labels">
                        <span>Low</span>
                        <span>Moderate</span>
                        <span>High</span>
                    </div>
                </div>

                <div class="field full-width">
                    <label>Notes</label>
                    <textarea rows="3"></textarea>
                </div>

                <div class="field full-width">
                    <label>Support Action</label>
                    <textarea rows="3"></textarea>
                </div>

            </div>
        </div>

        <!-- ================= ATTENDANCE ================= -->
        <div class="barrier-card">

            <div class="barrier-header">
                <label class="barrier-toggle">
                    <input type="checkbox" name="barriers" value="attendance">
                    <span>Attendance Consistency</span>
                </label>
            </div>

            <div class="barrier-details">

                <div class="field">
                    <label>Status</label>
                    <select name="attendance_status">
                        <option>Emerging</option>
                        <option>Ongoing</option>
                        <option>Improving</option>
                        <option>Resolved</option>
                        <option>Needs Follow-Up</option>
                    </select>
                </div>

                <div class="field">
                    <label>Severity Level</label>
                    <input type="range" min="1" max="5" value="3" class="severity-slider">
                    <div class="severity-labels">
                        <span>Low</span>
                        <span>Moderate</span>
                        <span>High</span>
                    </div>
                </div>

                <div class="field full-width">
                    <label>Notes</label>
                    <textarea rows="3"></textarea>
                </div>

                <div class="field full-width">
                    <label>Support Action</label>
                    <textarea rows="3"></textarea>
                </div>

            </div>
        </div>

        <!-- ================= COMMUNICATION ================= -->
        <div class="barrier-card">

            <div class="barrier-header">
                <label class="barrier-toggle">
                    <input type="checkbox" name="barriers" value="communication">
                    <span>Communication Skills</span>
                </label>
            </div>

            <div class="barrier-details">

                <div class="field">
                    <label>Status</label>
                    <select>
                        <option>Emerging</option>
                        <option>Ongoing</option>
                        <option>Improving</option>
                        <option>Resolved</option>
                        <option>Needs Follow-Up</option>
                    </select>
                </div>

                <div class="field">
                    <label>Severity Level</label>
                    <input type="range" min="1" max="5" value="3" class="severity-slider">
                </div>

                <div class="field full-width">
                    <label>Notes</label>
                    <textarea rows="3"></textarea>
                </div>

                <div class="field full-width">
                    <label>Support Action</label>
                    <textarea rows="3"></textarea>
                </div>

            </div>
        </div>

    </div>

    <!-- ================= SUMMARY ================= -->
    <div class="barrier-summary">

        <h3>Barrier Risk Summary</h3>

        <div class="summary-grid">

            <div class="summary-item">
                <span>Active Barriers</span>
                <strong>4</strong>
            </div>

            <div class="summary-item">
                <span>High Severity</span>
                <strong>2</strong>
            </div>

            <div class="summary-item">
                <span>Needs Follow-Up</span>
                <strong>3</strong>
            </div>

        </div>

    </div>

    <!-- ================= SUBMIT ================= -->
    <div class="form-actions">
        <button type="submit" class="submit-btn">
            Submit Form
        </button>
    </div>

</section>

</body>
</html>
