<section class="form-card">

    <h2>Job Placement & Employer Feedback</h2>

    <p class="section-description">
        Document employment placement outcomes and employer feedback.
    </p>

    <!-- ================= PLACEMENT STATUS ================= -->
    <div class="form-grid">

        <div class="field">
            <label>Placement Status</label>
            <select>
                <option>Interview Scheduled</option>
                <option>Placed</option>
                <option>Pending Placement</option>
                <option>Declined Position</option>
                <option>Placement Ended</option>
            </select>
        </div>

        <div class="field">
            <label>Employer Name</label>
            <input type="text" placeholder="Enter employer name">
        </div>

        <div class="field">
            <label>Job Title</label>
            <input type="text" placeholder="Enter job title">
        </div>

        <div class="field">
            <label>Placement Start Date</label>
            <input type="date">
        </div>

        <div class="field">
            <label>Hours Per Week</label>
            <input type="number" placeholder="e.g. 40">
        </div>

        <div class="field">
            <label>Hourly Wage</label>
            <input type="number" step="0.01" placeholder="e.g. 15.00">
        </div>

    </div>

    <!-- ================= JOB DETAILS ================= -->
    <div class="field full-width" style="margin-top:20px;">

        <label>Primary Job Responsibilities</label>
        <textarea rows="4" placeholder="Describe main duties and responsibilities..."></textarea>

    </div>

    <!-- ================= EMPLOYMENT OUTCOME ================= -->
    <div class="form-grid">

        <div class="field">
            <label>Maintained Employment for 30 Days?</label>
            <select>
                <option>Yes</option>
                <option>No</option>
                <option>Not Applicable</option>
            </select>
        </div>

        <div class="field">
            <label>Employer Satisfaction Rating</label>
            <select>
                <option>Excellent</option>
                <option>Good</option>
                <option>Fair</option>
                <option>Poor</option>
            </select>
        </div>

    </div>

    <!-- ================= FEEDBACK ================= -->
    <div class="field full-width" style="margin-top:20px;">

        <label>Employer Feedback</label>
        <textarea rows="4" placeholder="Enter employer comments or feedback..."></textarea>

    </div>

    <div class="field full-width">

        <label>Recommended Next Steps</label>
        <textarea rows="4" placeholder="Suggested actions or improvements..."></textarea>

    </div>

    <!-- ================= SUBMIT ================= -->
    <div class="form-actions">

        <button type="submit" class="submit-btn">
            Submit Placement Report
        </button>

    </div>

</section>
