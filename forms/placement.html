<section class="form-card">

<h2>Section F — Job Placement & Employer Feedback</h2>

<p class="section-description">
Document employment placement outcomes and employer feedback.
</p>

<div class="form-grid">

<div class="field">
<label>Placement Status</label>
<select>
<option>Interview Scheduled</option>
<option>Placed</option>
<option>Pending Placement</option>
<option>Declined Position</option>
<option>Placement Ended</option>
</select>
</div>

<div class="field">
<label>Employer Name</label>
<input type="text">
</div>

<div class="field">
<label>Job Title</label>
<input type="text">
</div>

<div class="field">
<label>Placement Start Date</label>
<input type="date">
</div>

<div class="field">
<label>Hours Per Week</label>
<input type="number">
</div>

<div class="field">
<label>Hourly Wage</label>
<input type="number" step="0.01">
</div>

<div class="field full-width">
<label>Primary Job Responsibilities</label>
<textarea rows="4"></textarea>
</div>

<div class="field">
<label>Has the resident maintained employment for 30 days?</label>
<select>
<option>Yes</option>
<option>No</option>
<option>Not Applicable</option>
</select>
</div>

<div class="field">
<label>Employer Satisfaction Rating</label>
<select>
<option>Excellent</option>
<option>Good</option>
<option>Fair</option>
<option>Poor</option>
</select>
</div>

<div class="field full-width">
<label>Employer Feedback</label>
<textarea rows="4"></textarea>
</div>

<div class="field full-width">
<label>Recommended Next Steps</label>
<textarea rows="4"></textarea>
</div>

</div>

<div class="feedback-box">

<label>Employer Feedback</label>

<textarea rows="4"></textarea>

</div>


<div class="form-actions">

<button type="submit" class="submit-btn">
    Submit Form
</button>

</div>

</section>
