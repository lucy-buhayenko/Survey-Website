<section class="form-card">

    <h2>Section E — Initial Barriers Assessment</h2>

    <p class="section-description">
        Identify barriers that may impact workforce readiness, participation,
        and placement success.
    </p>

    <div class="barrier-grid">

        <!-- Transportation -->

        <div class="barrier-card">

            <div class="barrier-header">

                <label class="barrier-toggle">

                    <input
                        type="checkbox"
                        name="barrier_transportation">

                    <span>Transportation</span>

                </label>

            </div>

            <div class="barrier-details">

                <div class="field">

                    <label>Barrier Status</label>

                    <select>
                        <option>Emerging</option>
                        <option>Ongoing</option>
                        <option>Improving</option>
                        <option>Resolved</option>
                        <option>Needs Follow-Up</option>
                    </select>

                </div>

                <div class="field">

                    <label>Severity Level</label>

                    <input
                        type="range"
                        min="1"
                        max="5"
                        value="3"
                        class="severity-slider">

                    <div class="severity-labels">
                        <span>Low</span>
                        <span>Moderate</span>
                        <span>High</span>
                    </div>

                </div>

                <div class="field">

                    <label>Notes</label>

                    <textarea rows="3"></textarea>

                </div>

                <div class="field">

                    <label>Recommended Support Action</label>

                    <textarea rows="3"></textarea>

                </div>

            </div>

        </div>

        <!-- Attendance -->

        <div class="barrier-card">

            <div class="barrier-header">

                <label class="barrier-toggle">

                    <input
                        type="checkbox"
                        name="barrier_attendance">

                    <span>Attendance Consistency</span>

                </label>

            </div>

            <div class="barrier-details">

                <div class="field">

                    <label>Barrier Status</label>

                    <select>
                        <option>Emerging</option>
                        <option>Ongoing</option>
                        <option>Improving</option>
                        <option>Resolved</option>
                        <option>Needs Follow-Up</option>
                    </select>

                </div>

                <div class="field">

                    <label>Severity Level</label>

                    <input
                        type="range"
                        min="1"
                        max="5"
                        value="3"
                        class="severity-slider">

                </div>

                <div class="field">
                    <label>Notes</label>
                    <textarea rows="3"></textarea>
                </div>

                <div class="field">
                    <label>Recommended Support Action</label>
                    <textarea rows="3"></textarea>
                </div>

            </div>

        </div>

        <!-- Repeat Pattern -->

        <!-- Emotional Readiness -->
        <!-- Interview Confidence -->
        <!-- Communication Skills -->
        <!-- Documentation / ID -->
        <!-- Legal Concerns -->
        <!-- Scheduling Conflicts -->
        <!-- Housing Instability -->
        <!-- Technology Access -->
        <!-- Motivation -->
        <!-- Anxiety Around Work Environments -->

    </div>

</section>



<div class="barrier-summary">

    <h3>Barrier Risk Summary</h3>

    <div class="summary-grid">

        <div class="summary-item">
            <span>Active Barriers</span>
            <strong>4</strong>
        </div>

        <div class="summary-item">
            <span>High Severity</span>
            <strong>2</strong>
        </div>

        <div class="summary-item">
            <span>Needs Follow-Up</span>
            <strong>3</strong>
        </div>

    </div>

</div>
