<section class="form-card">

    <h2>Program Effectiveness Evaluation</h2>

    <p class="section-description">
        Assess the effectiveness of program services and overall outcomes.
    </p>

    <!-- ================= CORE RATINGS ================= -->
    <div class="evaluation-grid">

        <div class="eval-card">
            <label>Overall Program Quality</label>
            <select>
                <option>Excellent</option>
                <option>Good</option>
                <option>Average</option>
                <option>Needs Improvement</option>
            </select>
        </div>

        <div class="eval-card">
            <label>Staff Support Effectiveness</label>
            <select>
                <option>Very Useful</option>
                <option>Useful</option>
                <option>Somewhat Useful</option>
                <option>Not Useful</option>
            </select>
        </div>

        <div class="eval-card">
            <label>Workforce Goals Achievement</label>
            <select>
                <option>Fully Achieved</option>
                <option>Partially Achieved</option>
                <option>Not Achieved</option>
            </select>
        </div>

        <div class="eval-card">
            <label>Most Beneficial Component</label>
            <select>
                <option>Workshops</option>
                <option>Job Coaching</option>
                <option>Mock Interviews</option>
                <option>Community Placements</option>
                <option>Life Skills Training</option>
            </select>
        </div>

    </div>

    <!-- ================= OPEN FEEDBACK ================= -->
    <div class="field full-width">

        <label>Which services should be expanded?</label>
        <textarea rows="3" placeholder="Describe areas that should grow..."></textarea>

    </div>

    <div class="field full-width">

        <label>Which services should be improved?</label>
        <textarea rows="3" placeholder="Describe improvement opportunities..."></textarea>

    </div>

    <div class="field full-width">

        <label>Program strengths observed</label>
        <textarea rows="3" placeholder="What worked well?"></textarea>

    </div>

    <div class="field full-width">

        <label>Program challenges observed</label>
        <textarea rows="3" placeholder="What did not work well?"></textarea>

    </div>

    <!-- ================= SUMMARY SECTION ================= -->
    <div class="response-panel">

        <h3>Evaluation Summary</h3>

        <p>
            This section captures overall program effectiveness trends and can be used for reporting and improvement planning.
        </p>

    </div>

    <!-- ================= SUBMIT ================= -->
    <div class="form-actions">

        <button type="submit" class="submit-btn">
            Submit Evaluation
        </button>

    </div>

</section>
